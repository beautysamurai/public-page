name: Apply Copilot review fixes

on:
  push:
    branches:
      - feature/startup-sync-pr
    paths:
      - .github/workflows/apply-copilot-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-copilot-review-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'beautysamurai/public-page' && github.actor == 'beautysamurai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v7
        with:
          ref: feature/startup-sync-pr
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply the reviewed patch
        shell: bash
        run: |
          git apply --check .automation/public-page-copilot-fixes.patch
          git apply .automation/public-page-copilot-fixes.patch

      - name: Run validation
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_model_math.cjs
          python scripts/import_scheduler_history.py --check
          git diff --check

      - name: Remove one-shot automation files
        shell: bash
        run: |
          rm .automation/public-page-copilot-fixes.patch
          rmdir .automation
          rm .github/workflows/apply-copilot-fixes.yml

      - name: Commit and push the fixes
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'Public Research Digest'
          git config user.email 'public-research-digest@users.noreply.github.com'
          git add -A
          git commit -m 'fix: require producer-complete startup handoff'
          git push origin "HEAD:${BRANCH_NAME}"
