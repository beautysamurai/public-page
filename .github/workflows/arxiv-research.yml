name: Automated arXiv research

on:
  schedule:
    # 15:30 JST, after arXiv's normal daily announcement/feed window.
    - cron: "30 15 * * *"
      timezone: "Asia/Tokyo"
    # Weekly synthesis on Sunday morning, covering the seven days through Friday.
    - cron: "0 8 * * 0"
      timezone: "Asia/Tokyo"
    # Monthly synthesis on the first morning, covering the previous calendar month.
    - cron: "0 8 1 * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Review to run"
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly
          - monthly
      period_end:
        description: "Optional recovery date (Friday for weekly, month-end for monthly)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automated-arxiv-research
  queue: max

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AUTOMATION_BRANCH: automation/openai-arxiv-research
    steps:

      - name: Plan review mode
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule || '' }}
          REQUESTED_MODE: ${{ inputs.run_mode || '' }}
          REQUESTED_PERIOD_END: ${{ inputs.period_end || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import calendar
          import os
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          event_name = os.environ["EVENT_NAME"]
          schedule = os.environ["SCHEDULE_EXPRESSION"]
          requested_mode = os.environ["REQUESTED_MODE"].strip()
          requested_period_end = os.environ["REQUESTED_PERIOD_END"].strip()

          if event_name == "workflow_dispatch":
              mode = requested_mode or "daily"
          else:
              mode = {
                  "30 15 * * *": "daily",
                  "0 8 * * 0": "weekly",
                  "0 8 1 * *": "monthly",
              }.get(schedule)
              if mode is None:
                  raise SystemExit(f"unexpected schedule expression: {schedule!r}")

          if mode not in {"daily", "weekly", "monthly"}:
              raise SystemExit(f"unexpected review mode: {mode!r}")

          today_jst = datetime.now(ZoneInfo("Asia/Tokyo")).date()
          period_end = ""
          if mode == "daily":
              if requested_period_end:
                  raise SystemExit("period_end is only valid for weekly or monthly runs")
          else:
              if requested_period_end:
                  try:
                      parsed_end = date.fromisoformat(requested_period_end)
                  except ValueError as exc:
                      raise SystemExit("period_end must be a valid YYYY-MM-DD date") from exc
                  if parsed_end.isoformat() != requested_period_end:
                      raise SystemExit("period_end must be a canonical YYYY-MM-DD date")
              elif mode == "weekly":
                  parsed_end = today_jst - timedelta(days=(today_jst.weekday() - 4) % 7)
              else:
                  parsed_end = today_jst.replace(day=1) - timedelta(days=1)

              if mode == "weekly" and parsed_end.weekday() != 4:
                  raise SystemExit("weekly period_end must be a Friday")
              if mode == "monthly":
                  last_day = calendar.monthrange(parsed_end.year, parsed_end.month)[1]
                  if parsed_end.day != last_day:
                      raise SystemExit("monthly period_end must be the final day of a month")
              period_end = parsed_end.isoformat()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"mode={mode}\n")
              output.write(f"period_end={period_end}\n")
          print(f"planned {mode} review" + (f" ending {period_end}" if period_end else ""))
          PY
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Continue the durable automation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$AUTOMATION_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$AUTOMATION_BRANCH"
            git checkout -B "$AUTOMATION_BRANCH" FETCH_HEAD
            git merge --no-edit origin/main
          else
            git checkout -b "$AUTOMATION_BRANCH" origin/main
          fi

      - name: Verify the automation branch is data-only
        shell: bash
        run: |
          set -euo pipefail

          executable_paths=(
            .github/workflows/arxiv-research.yml
            requirements.txt
            config/research.json
            scripts/research_language.py
            scripts/research_pipeline.py
            scripts/research_publication.py
            scripts/import_scheduler_history.py
            scripts/validate_public_bundle.py
          )
          if ! git diff --quiet origin/main HEAD -- "${executable_paths[@]}"; then
            echo "::error::The persistent automation branch changes executable code or configuration."
            git diff --name-only origin/main HEAD -- "${executable_paths[@]}"
            exit 1
          fi

          while IFS= read -r -d '' path; do
            case "$path" in
              research/*|content/chatgpt_scheduler_history.json|site/data/*)
                ;;
              *)
                printf '::error::The persistent automation branch contains a non-data change: %q\n' "$path"
                exit 1
                ;;
            esac

            mode="$(git ls-files -s -- "$path" | awk 'NR == 1 { print $1 }')"
            if [[ -z "$mode" ]]; then
              mode="$(git ls-tree origin/main -- "$path" | awk 'NR == 1 { print $1 }')"
            fi
            if [[ "$mode" != "100644" ]]; then
              printf '::error::Automation data must be a regular non-executable tracked file: %q\n' "$path"
              exit 1
            fi
          done < <(git diff --name-only -z --no-renames origin/main HEAD)

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install the OpenAI SDK
        run: python -m pip install -r requirements.txt

      - name: Preflight before paid research
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          node --test tests/test_model_math.cjs
          python scripts/import_scheduler_history.py --check
          git diff --check


      - name: Inspect existing period review
        if: steps.plan.outputs.mode != 'daily'
        id: period_review
        env:
          REVIEW_PERIOD: ${{ steps.plan.outputs.mode }}
          REVIEW_PERIOD_END: ${{ steps.plan.outputs.period_end }}
        shell: bash
        run: |
          set -euo pipefail
          review_json="research/reviews/${REVIEW_PERIOD}/${REVIEW_PERIOD_END}.json"
          review_markdown="research/reviews/${REVIEW_PERIOD}/${REVIEW_PERIOD_END}.md"
          complete="$(PYTHONPATH=scripts python - "$review_json" "$review_markdown" "$REVIEW_PERIOD" "$REVIEW_PERIOD_END" <<'PY'
          import json
          import sys
          from pathlib import Path

          from research_pipeline import report_to_markdown, validate_report

          json_path = Path(sys.argv[1])
          markdown_path = Path(sys.argv[2])
          expected_kind = sys.argv[3]
          expected_end = sys.argv[4]

          if not json_path.exists():
              if markdown_path.exists():
                  raise SystemExit(f"period Markdown exists without JSON: {markdown_path}")
              print("false")
              raise SystemExit(0)
          if json_path.is_symlink() or not json_path.is_file():
              raise SystemExit(f"period JSON is not a regular file: {json_path}")

          with json_path.open("r", encoding="utf-8") as handle:
              report = json.load(handle)
          validate_report(report)
          if (
              report["reportKind"] != expected_kind
              or report["reportDate"] != expected_end
              or report["periodEnd"] != expected_end
          ):
              raise SystemExit(f"period report identity mismatch: {json_path}")

          completed = {
              "UPDATE_CONFIRMED",
              "NO_RELEVANT_PAPERS",
              "NO_NEW_BATCH_EXPECTED",
          }
          if report["status"] not in completed:
              print("false")
              raise SystemExit(0)

          rendered = report_to_markdown(report)
          existing = (
              markdown_path.read_text(encoding="utf-8")
              if markdown_path.exists() and not markdown_path.is_symlink()
              else None
          )
          if markdown_path.is_symlink():
              raise SystemExit(f"period Markdown is not a regular file: {markdown_path}")
          if existing != rendered:
              markdown_path.write_text(rendered, encoding="utf-8", newline="\n")
          print("true")
          PY
          )"
          {
            echo "complete=$complete"
            echo "report_path=$review_json"
          } >> "$GITHUB_OUTPUT"
          if [[ "$complete" == "true" ]]; then
            echo "Reusing completed period review without another API call: $review_json"
          fi

      - name: Run weekly or monthly review
        if: steps.plan.outputs.mode != 'daily' && steps.period_review.outputs.complete != 'true'
        id: aggregate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_PERIOD: ${{ steps.plan.outputs.mode }}
          REVIEW_PERIOD_END: ${{ steps.plan.outputs.period_end }}
        shell: bash
        run: |
          set -euo pipefail
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          result_path="$RUNNER_TEMP/${REVIEW_PERIOD}-report.json"
          python scripts/research_pipeline.py \
            --config config/research.json \
            --env-file /dev/null \
            aggregate \
            --period "$REVIEW_PERIOD" \
            --period-end "$REVIEW_PERIOD_END" \
            --daily-dir research/daily \
            --output-dir research/reviews \
            --generated-at "$generated_at" \
            > "$result_path"

          report_path="research/reviews/${REVIEW_PERIOD}/${REVIEW_PERIOD_END}.json"
          markdown_path="research/reviews/${REVIEW_PERIOD}/${REVIEW_PERIOD_END}.md"
          PYTHONPATH=scripts python - "$result_path" "$report_path" "$markdown_path" "$REVIEW_PERIOD" "$REVIEW_PERIOD_END" <<'PY'
          import json
          import sys
          from pathlib import Path

          from research_pipeline import validate_report

          result_path, report_path, markdown_path = map(Path, sys.argv[1:4])
          expected_kind = sys.argv[4]
          expected_end = sys.argv[5]
          for path in (result_path, report_path, markdown_path):
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"aggregate output is not a regular file: {path}")
          with result_path.open("r", encoding="utf-8") as handle:
              returned = json.load(handle)
          with report_path.open("r", encoding="utf-8") as handle:
              persisted = json.load(handle)
          validate_report(returned)
          validate_report(persisted)
          if returned != persisted:
              raise SystemExit("aggregate command output differs from persisted report")
          if (
              persisted["reportKind"] != expected_kind
              or persisted["reportDate"] != expected_end
              or persisted["periodEnd"] != expected_end
          ):
              raise SystemExit("aggregate output identity mismatch")
          print(f"generated {expected_kind} review: {report_path} ({persisted['status']})")
          PY

      - name: Run daily research
        if: steps.plan.outputs.mode == 'daily'
        id: research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/research_pipeline.py \
            --config config/research.json \
            --env-file /dev/null \
            daily \
            --checked-at "$generated_at" \
            --state research/state.json \
            --output-dir research/daily \
            > "$RUNNER_TEMP/daily-report.json"

          daily_report_date="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["reportDate"])' "$RUNNER_TEMP/daily-report.json")"
          if [[ ! "$daily_report_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            printf '::error::Invalid report date returned by the research pipeline: %q\n' "$daily_report_date"
            exit 1
          fi
          report_path="research/daily/${daily_report_date}.json"
          if [[ ! -f "$report_path" || -L "$report_path" ]]; then
            printf '::error::The research pipeline did not produce a regular report file: %q\n' "$report_path"
            exit 1
          fi
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$report_path")"
          case "$status" in
            UPDATE_CONFIRMED|NO_RELEVANT_PAPERS|NO_NEW_BATCH_EXPECTED)
              publishable=true
              ;;
            UPDATE_NOT_CONFIRMED|UPDATER_OFFLINE)
              publishable=false
              echo "Keeping incomplete report out of the public archive: $report_path ($status)"
              ;;
            *)
              printf '::error::Unexpected daily report status: %q\n' "$status"
              exit 1
              ;;
          esac
          {
            echo "report_path=$report_path"
            echo "status=$status"
            echo "publishable=$publishable"
          } >> "$GITHUB_OUTPUT"

      - name: Validate generated research boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path, PurePosixPath

          def changed_names() -> list[str]:
              commands = (
                  ["git", "diff", "--name-only", "-z", "--no-renames", "HEAD", "--"],
                  ["git", "ls-files", "-z", "--others", "--exclude-standard"],
              )
              names: list[str] = []
              for command in commands:
                  output = subprocess.check_output(command)
                  names.extend(
                      name for name in output.decode("utf-8", "surrogateescape").split("\0")
                      if name
                  )
              return list(dict.fromkeys(names))

          def research_names() -> list[str]:
              output = subprocess.check_output(
                  [
                      "git", "ls-files", "-z", "--cached", "--others",
                      "--exclude-standard", "--", "research",
                  ]
              )
              return [
                  name for name in output.decode(
                      "utf-8", "surrogateescape"
                  ).split("\0") if name
              ]

          secret_patterns = {
              "private key block": re.compile(
                  rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"
              ),
              "GitHub token": re.compile(
                  rb"(?:gh[opsu]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{40,})"
              ),
              "AWS access key": re.compile(rb"AKIA[0-9A-Z]{16}"),
              "OpenAI-style key": re.compile(rb"sk-[A-Za-z0-9_-]{20,}"),
          }
          problems = []
          names = list(dict.fromkeys([*changed_names(), *research_names()]))
          for name in names:
              posix = PurePosixPath(name)
              if not posix.parts or posix.parts[0] != "research":
                  problems.append(f"out-of-bound generated path: {name}")
                  continue
              if posix.suffix.lower() not in {".json", ".md"}:
                  problems.append(f"unexpected research file type: {name}")
                  continue
              path = Path(name)
              if path.is_symlink():
                  problems.append(f"research output is not a regular file: {name}")
                  continue
              if not path.exists():
                  tracked_deletion = subprocess.run(
                      ["git", "cat-file", "-e", f"HEAD:{name}"],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      check=False,
                  ).returncode == 0
                  if not tracked_deletion:
                      problems.append(f"missing untracked research output: {name}")
                  continue
              if not path.is_file():
                  problems.append(f"research output is not a regular file: {name}")
                  continue
              if path.stat().st_size > 32 * 1024 * 1024:
                  problems.append(f"research output exceeds 32 MiB: {name}")
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  problems.append(f"binary research output: {name}")
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  problems.append(f"non-UTF-8 research output: {name}")
                  continue
              if posix.suffix.lower() == ".json":
                  try:
                      json.loads(text)
                  except json.JSONDecodeError as error:
                      problems.append(f"invalid JSON research output: {name}: {error}")
              for label, pattern in secret_patterns.items():
                  if pattern.search(data):
                      problems.append(f"possible {label}: {name}")
          if problems:
              raise SystemExit(
                  "Generated research validation failed:\n- "
                  + "\n- ".join(sorted(set(problems)))
              )
          print(f"generated research validation passed for {len(names)} files")
          PY

      - name: Persist research state and report
        id: research_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research

          while IFS= read -r -d '' path; do
            case "$path" in
              research/*)
                ;;
              *)
                printf '::error::The research commit contains an out-of-bound path: %q\n' "$path"
                exit 1
                ;;
            esac
            mode="$(git ls-files -s -- "$path" | awk 'NR == 1 { print $1 }')"
            if [[ -z "$mode" ]]; then
              mode="$(git ls-tree HEAD -- "$path" | awk 'NR == 1 { print $1 }')"
            fi
            if [[ "$mode" != "100644" ]]; then
              printf '::error::Research data must be a regular non-executable file: %q\n' "$path"
              exit 1
            fi
          done < <(git diff --cached --name-only -z --no-renames)

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "research: persist automated arXiv state"
          git push origin "HEAD:$AUTOMATION_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"


      - name: Reconcile completed research reports
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research_publication.py \
            --daily-report-dir research/daily

          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          incomplete = {"UPDATE_NOT_CONFIRMED", "UPDATER_OFFLINE"}
          completed = {
              "UPDATE_CONFIRMED",
              "NO_RELEVANT_PAPERS",
              "NO_NEW_BATCH_EXPECTED",
          }
          for kind in ("weekly", "monthly"):
              report_dir = Path("research/reviews") / kind
              if not report_dir.exists():
                  continue
              if report_dir.is_symlink() or not report_dir.is_dir():
                  raise SystemExit(f"aggregate report directory is invalid: {report_dir}")
              for report_path in sorted(report_dir.glob("*.json")):
                  if report_path.is_symlink() or not report_path.is_file():
                      raise SystemExit(f"aggregate report is not a regular file: {report_path}")
                  with report_path.open("r", encoding="utf-8") as handle:
                      report = json.load(handle)
                  if (
                      report.get("reportKind") != kind
                      or report.get("reportDate") != report_path.stem
                      or report.get("periodEnd") != report_path.stem
                  ):
                      raise SystemExit(f"aggregate report identity mismatch: {report_path}")
                  status = report.get("status")
                  if status in incomplete:
                      print(f"keeping incomplete aggregate out of publication: {report_path}")
                      continue
                  if status not in completed:
                      raise SystemExit(
                          f"unexpected aggregate report status {status!r}: {report_path}"
                      )
                  subprocess.run(
                      [
                          sys.executable,
                          "scripts/research_publication.py",
                          "--report",
                          str(report_path),
                      ],
                      check=True,
                  )
          PY

          python scripts/research_publication.py \
            --daily-report-dir research/daily \
            --regenerate-site

      - name: Validate generated publication and change scope
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          node --test tests/test_model_math.cjs
          python scripts/import_scheduler_history.py --check
          git diff --check
          python - <<'PY'
          import subprocess
          from pathlib import Path, PurePosixPath

          commands = (
              ["git", "diff", "--name-only", "-z", "--no-renames", "HEAD", "--"],
              ["git", "ls-files", "-z", "--others", "--exclude-standard"],
          )
          names = []
          for command in commands:
              output = subprocess.check_output(command)
              names.extend(
                  name for name in output.decode("utf-8", "surrogateescape").split("\0")
                  if name
              )
          names = list(dict.fromkeys(names))
          problems = []
          for name in names:
              posix = PurePosixPath(name)
              allowed = (
                  name == "content/chatgpt_scheduler_history.json"
                  or (len(posix.parts) >= 2 and posix.parts[:2] == ("site", "data"))
              )
              if not allowed:
                  problems.append(f"out-of-bound publication path: {name}")
                  continue
              path = Path(name)
              if path.is_symlink():
                  problems.append(f"publication output is not a regular file: {name}")
                  continue
              if not path.exists():
                  tracked_deletion = subprocess.run(
                      ["git", "cat-file", "-e", f"HEAD:{name}"],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      check=False,
                  ).returncode == 0
                  if not tracked_deletion:
                      problems.append(f"missing untracked publication output: {name}")
                  continue
              if not path.is_file():
                  problems.append(f"publication output is not a regular file: {name}")
          if problems:
              raise SystemExit(
                  "Generated publication validation failed:\n- "
                  + "\n- ".join(sorted(set(problems)))
              )
          print(f"generated publication scope passed for {len(names)} files")
          PY

      - name: Reject private state and likely secrets before publication commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path, PurePosixPath

          output = subprocess.check_output(
              [
                  "git", "ls-files", "-z", "--cached", "--others",
                  "--exclude-standard",
              ]
          )
          names = [name for name in output.decode().split("\0") if name]
          secret_patterns = {
              "private key block": re.compile(
                  rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"
              ),
              "GitHub token": re.compile(
                  rb"(?:gh[opsu]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{40,})"
              ),
              "AWS access key": re.compile(rb"AKIA[0-9A-Z]{16}"),
              "OpenAI-style key": re.compile(rb"sk-[A-Za-z0-9_-]{20,}"),
          }
          forbidden_suffixes = {
              ".key", ".p12", ".pfx", ".pem", ".sqlite", ".sqlite3"
          }
          problems = []
          for name in names:
              posix = PurePosixPath(name)
              if posix.parts and posix.parts[0] == ".local":
                  problems.append(f"private-state path: {name}")
              if posix.name == ".env" or (
                  posix.name.startswith(".env.") and posix.name != ".env.example"
              ):
                  problems.append(f"environment file: {name}")
              if posix.suffix.lower() in forbidden_suffixes:
                  problems.append(f"credential/database file: {name}")
              path = Path(name)
              if path.is_symlink():
                  problems.append(f"symbolic link: {name}")
                  continue
              if not path.is_file() or path.stat().st_size > 2_000_000:
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              for label, pattern in secret_patterns.items():
                  if pattern.search(data):
                      problems.append(f"possible {label}: {name}")
          if problems:
              raise SystemExit("Privacy scan failed:\n- " + "\n- ".join(sorted(set(problems))))
          print(f"privacy scan passed for {len(names)} files")
          PY

      - name: Commit generated publication
        id: publication_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- content/chatgpt_scheduler_history.json site/data

          while IFS= read -r -d '' path; do
            case "$path" in
              content/chatgpt_scheduler_history.json|site/data/*)
                ;;
              *)
                printf '::error::The publication commit contains an out-of-bound path: %q\n' "$path"
                exit 1
                ;;
            esac
            mode="$(git ls-files -s -- "$path" | awk 'NR == 1 { print $1 }')"
            if [[ -z "$mode" ]]; then
              mode="$(git ls-tree HEAD -- "$path" | awk 'NR == 1 { print $1 }')"
            fi
            if [[ "$mode" != "100644" ]]; then
              printf '::error::Publication data must be a regular non-executable file: %q\n' "$path"
              exit 1
            fi
          done < <(git diff --cached --name-only -z --no-renames)

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "content: publish automated arXiv review"
          git push origin "HEAD:$AUTOMATION_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the review pull request
        if: always() && (steps.research_commit.outputs.changed == 'true' || steps.publication_commit.outputs.changed == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --base main --head "$AUTOMATION_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create \
              --base main \
              --head "$AUTOMATION_BRANCH" \
              --title "research: automated arXiv review" \
              --body "Automated daily arXiv screening plus scheduled weekly and monthly synthesis. arXiv/OpenAI failures remain incomplete and are not published. Completed reports are reconciled into the static archive; review the generated prose and ratings before merge."
          else
            echo "Updated existing review PR #$existing."
          fi
