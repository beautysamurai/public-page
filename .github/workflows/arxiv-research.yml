name: Automated arXiv research

on:
  schedule:
    # 15:30 JST, after arXiv's normal daily announcement/feed window.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automated-arxiv-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTOMATION_BRANCH: automation/openai-arxiv-research
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Continue the durable automation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$AUTOMATION_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$AUTOMATION_BRANCH"
            git checkout -B "$AUTOMATION_BRANCH" FETCH_HEAD
            git merge --no-edit origin/main
          else
            git checkout -b "$AUTOMATION_BRANCH" origin/main
          fi

      - name: Verify the automation branch is data-only
        shell: bash
        run: |
          set -euo pipefail

          executable_paths=(
            .github/workflows/arxiv-research.yml
            requirements.txt
            config/research.json
            scripts/research_pipeline.py
            scripts/research_publication.py
            scripts/import_scheduler_history.py
            scripts/validate_public_bundle.py
          )
          if ! git diff --quiet origin/main HEAD -- "${executable_paths[@]}"; then
            echo "::error::The persistent automation branch changes executable code or configuration."
            git diff --name-only origin/main HEAD -- "${executable_paths[@]}"
            exit 1
          fi

          while IFS= read -r -d '' path; do
            case "$path" in
              research/*|content/chatgpt_scheduler_history.json|site/data/*)
                ;;
              *)
                printf '::error::The persistent automation branch contains a non-data change: %q\n' "$path"
                exit 1
                ;;
            esac

            mode="$(git ls-files -s -- "$path" | awk 'NR == 1 { print $1 }')"
            if [[ "$mode" != "100644" ]]; then
              printf '::error::Automation data must be a regular non-executable tracked file: %q\n' "$path"
              exit 1
            fi
          done < <(git diff --name-only -z --no-renames origin/main HEAD)

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install the OpenAI SDK
        run: python -m pip install -r requirements.txt

      - name: Run daily research and due period reviews
        id: research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          run_date="${generated_at%%T*}"

          python scripts/research_pipeline.py \
            --config config/research.json \
            --env-file /dev/null \
            daily \
            --checked-at "$generated_at" \
            --state research/state.json \
            --output-dir research/daily \
            > "$RUNNER_TEMP/daily-report.json"

          daily_report_date="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["reportDate"])' "$RUNNER_TEMP/daily-report.json")"
          report_paths=("research/daily/${daily_report_date}.json")

          weekday="$(date -u -d "$run_date" +'%u')"
          days_since_friday="$(( (10#$weekday + 2) % 7 ))"
          weekly_end="$(date -u -d "$run_date - $days_since_friday days" +'%Y-%m-%d')"

          first_of_month="${run_date:0:7}-01"
          current_month_end="$(date -u -d "$first_of_month +1 month -1 day" +'%Y-%m-%d')"
          if [[ "$run_date" == "$current_month_end" ]]; then
            monthly_end="$run_date"
          else
            monthly_end="$(date -u -d "$first_of_month -1 day" +'%Y-%m-%d')"
          fi

          run_due_aggregate() {
            local period="$1"
            local period_end="$2"
            local report_path="research/reviews/${period}/${period_end}.json"
            local temporary_report="$RUNNER_TEMP/${period}-report.json"
            local status=""

            if [[ -f "$report_path" ]]; then
              status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$report_path")"
            fi
            if [[ "$status" == "UPDATE_CONFIRMED" || "$status" == "NO_RELEVANT_PAPERS" ]]; then
              echo "The ${period} review ending ${period_end} is already complete."
            elif ! python scripts/research_pipeline.py \
              --config config/research.json \
              --env-file /dev/null \
              aggregate \
              --period "$period" \
              --period-end "$period_end" \
              --generated-at "$generated_at" \
              --daily-dir research/daily \
              --output-dir research/reviews \
              > "$temporary_report"; then
              echo "::warning::The ${period} review ending ${period_end} could not be generated; daily state will still be saved."
            fi

            if [[ -f "$report_path" ]]; then
              report_paths+=("$report_path")
            fi
          }

          run_due_aggregate weekly "$weekly_end"
          run_due_aggregate monthly "$monthly_end"

          for report_path in "${report_paths[@]}"; do
            status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$report_path")"
            if [[ "$status" == "UPDATE_NOT_CONFIRMED" || "$status" == "UPDATER_OFFLINE" ]]; then
              echo "Keeping incomplete report out of the public archive: $report_path ($status)"
              continue
            fi
            python scripts/research_publication.py \
              --report "$report_path" \
              --regenerate-site
          done

      - name: Validate generated site and privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          node --test tests/test_model_math.cjs
          python scripts/import_scheduler_history.py --check
          git diff --check

      - name: Reject private state and likely secrets before commit
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path, PurePosixPath

          output = subprocess.check_output(
              [
                  "git", "ls-files", "-z", "--cached", "--others",
                  "--exclude-standard",
              ]
          )
          names = [name for name in output.decode().split("\0") if name]
          secret_patterns = {
              "private key block": re.compile(
                  rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"
              ),
              "GitHub token": re.compile(
                  rb"(?:gh[opsu]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{40,})"
              ),
              "AWS access key": re.compile(rb"AKIA[0-9A-Z]{16}"),
              "OpenAI-style key": re.compile(rb"sk-[A-Za-z0-9_-]{20,}"),
          }
          forbidden_suffixes = {
              ".key", ".p12", ".pfx", ".pem", ".sqlite", ".sqlite3"
          }
          problems = []
          for name in names:
              posix = PurePosixPath(name)
              if posix.parts and posix.parts[0] == ".local":
                  problems.append(f"private-state path: {name}")
              if posix.name == ".env" or (
                  posix.name.startswith(".env.") and posix.name != ".env.example"
              ):
                  problems.append(f"environment file: {name}")
              if posix.suffix.lower() in forbidden_suffixes:
                  problems.append(f"credential/database file: {name}")
              path = Path(name)
              if not path.is_file() or path.stat().st_size > 2_000_000:
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              for label, pattern in secret_patterns.items():
                  if pattern.search(data):
                      problems.append(f"possible {label}: {name}")
          if problems:
              raise SystemExit("Privacy scan failed:\n- " + "\n- ".join(sorted(set(problems))))
          print(f"privacy scan passed for {len(names)} files")
          PY

      - name: Commit the review branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research content/chatgpt_scheduler_history.json site/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "research: update automated arXiv review"
          git push origin "HEAD:$AUTOMATION_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the review pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --base main --head "$AUTOMATION_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create \
              --base main \
              --head "$AUTOMATION_BRANCH" \
              --title "research: automated arXiv review" \
              --body "Automated daily screen and any due weekly/monthly review. arXiv/OpenAI failures remain incomplete and are not published. Review the generated prose and ratings before merge."
          else
            echo "Updated existing review PR #$existing."
          fi
