name: Diagnose 2026-09-10 arXiv metadata

on:
  push:
    branches:
      - ops/diagnose-arxiv-0910

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Inspect failing public title and safety match
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET

          sys.path.insert(0, "scripts")
          import research_pipeline as p
          import import_scheduler_history as h

          pacer = p.ArxivRequestPacer()
          raw = p._fetch_oai_payload(
              "2609.10227",
              "arXiv",
              timeout=25.0,
              opener=pacer.open,
          )
          root = ET.fromstring(raw)
          metadata = root.find(
              f"{p.OAI_NS}GetRecord/{p.OAI_NS}record/{p.OAI_NS}metadata/{p.ARXIV_OAI_NS}arXiv"
          )
          if metadata is None:
              raise SystemExit("missing metadata")
          title = p._required_oai_text(metadata, "title")
          print("TITLE_REPR", repr(title))
          checks = [
              ("INTERNAL_CITATION_RE", h.INTERNAL_CITATION_RE),
              ("UUID_RE", h.UUID_RE),
              ("THREAD_ID_RE", h.THREAD_ID_RE),
              ("HTML_RE", h.HTML_RE),
              ("EMAIL_RE", h.EMAIL_RE),
              ("WINDOWS_PATH_RE", h.WINDOWS_PATH_RE),
              ("POSIX_PATH_RE", h.POSIX_PATH_RE),
              ("LOCAL_URI_RE", h.LOCAL_URI_RE),
              ("UNSUPPORTED_URI_RE", h.UNSUPPORTED_URI_RE),
              ("RELATIVE_PATH_RE", h.RELATIVE_PATH_RE),
              ("UTM_RE", h.UTM_RE),
              ("BARE_WEB_RE", h.BARE_WEB_RE),
              ("BARE_DOMAIN_RE", h.BARE_DOMAIN_RE),
          ]
          for name, pattern in checks:
              match = pattern.search(title)
              if match:
                  print("MATCH", name, repr(match.group(0)))
