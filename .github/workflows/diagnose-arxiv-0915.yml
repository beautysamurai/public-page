name: Diagnose 2026-09-15 arXiv metadata

on:
  push:
    branches:
      - ops/diagnose-arxiv-0915

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inspect duplicate authors
        shell: python
        run: |
          import sys, xml.etree.ElementTree as ET
          sys.path.insert(0, "scripts")
          import research_pipeline as p

          pacer=p.ArxivRequestPacer()
          raw=p._fetch_oai_payload("2609.15744","arXiv",timeout=25.0,opener=pacer.open)
          root=ET.fromstring(raw)
          metadata=root.find(f"{p.OAI_NS}GetRecord/{p.OAI_NS}record/{p.OAI_NS}metadata/{p.ARXIV_OAI_NS}arXiv")
          print("TITLE", p._required_oai_text(metadata,"title"))
          authors=metadata.find(f"{p.ARXIV_OAI_NS}authors")
          for idx,author in enumerate(authors.findall(f"{p.ARXIV_OAI_NS}author"),1):
              forenames=" ".join((author.findtext(f"{p.ARXIV_OAI_NS}forenames") or "").split())
              keyname=" ".join((author.findtext(f"{p.ARXIV_OAI_NS}keyname") or "").split())
              suffix=" ".join((author.findtext(f"{p.ARXIV_OAI_NS}suffix") or "").split())
              print("AUTHOR",idx,repr(forenames),repr(keyname),repr(suffix))
