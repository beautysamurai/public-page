name: Dispatch final arXiv pending recoveries

on:
  push:
    branches:
      - ops/rerun-arxiv-research

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Queue final three pending daily recoveries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            gh workflow run arxiv-research.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f run_mode=daily \
              -f recover_pending=true
            echo "queued final recovery $attempt of 3"
            sleep 2
          done
