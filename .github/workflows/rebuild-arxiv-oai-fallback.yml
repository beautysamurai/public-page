name: Rebuild clean arXiv OAI fallback branch

on:
  push:
    branches:
      - fix/arxiv-metadata-recovery

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out temporary implementation branch
        uses: actions/checkout@v7
        with:
          ref: fix/arxiv-metadata-recovery
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Preserve implementation files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arxiv-fix/scripts" "$RUNNER_TEMP/arxiv-fix/tests"
          cp scripts/research_pipeline.py "$RUNNER_TEMP/arxiv-fix/scripts/"
          cp tests/test_arxiv_retry_policy.py "$RUNNER_TEMP/arxiv-fix/tests/"

      - name: Rebuild branch from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B fix/arxiv-oai-metadata-fallback origin/main
          cp "$RUNNER_TEMP/arxiv-fix/scripts/research_pipeline.py" scripts/research_pipeline.py
          cp "$RUNNER_TEMP/arxiv-fix/tests/test_arxiv_retry_policy.py" tests/test_arxiv_retry_policy.py

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_arxiv_retry_policy.py" -v
          git diff --check

      - name: Commit and force-update review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Public Research Digest"
          git config user.email "public-research-digest@users.noreply.github.com"
          git add scripts/research_pipeline.py tests/test_arxiv_retry_policy.py
          git commit -m "fix: recover version-pinned arXiv metadata via OAI-PMH"
          git push --force origin HEAD:fix/arxiv-oai-metadata-fallback
