    <style>
      :root { color-scheme: dark; font-family: "Aptos", "Segoe UI", Arial, sans-serif; }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 28px;
        color: #fff;
        background: radial-gradient(circle at 72% 25%, rgba(154,215,196,.16), transparent 25rem), #0b1d2a;

      main { width: min(720px, 100%); border: 1px solid rgba(255,255,255,.2); padding: clamp(34px, 7vw, 76px); background: rgba(7,22,31,.48); }

      .mark { width: 34px; height: 30px; display: flex; align-items: end; gap: 3px; padding: 5px; background: rgba(255,255,255,.09); transform: skewX(-7deg); }
      .mark i { width: 5px; display: block; background: #9ad7c4; }
      .mark i:nth-child(1) { height: 35%; } .mark i:nth-child(2) { height: 70%; }
      .mark i:nth-child(3) { height: 51%; } .mark i:nth-child(4) { height: 100%; background: #d8ed78; }

      h1 { margin: 32px 0 14px; font: 400 clamp(2rem, 5vw, 3.8rem)/1 Georgia, serif; letter-spacing: -.04em; }
      p { max-width: 500px; margin: 0 0 30px; color: rgba(255,255,255,.62); font: 1rem/1.7 Georgia, serif; }
      a { min-height: 46px; display: inline-flex; align-items: center; padding: 0 20px; color: #0b1d2a; background: #d8ed78; font-size: .76rem; font-weight: 800; letter-spacing: .1em; text-decoration: none; text-transform: uppercase; }
      a:hover { background: #9ad7c4; }
      a:focus-visible { outline: 3px solid #bc6848; outline-offset: 4px; }
    </style>
  </head>
